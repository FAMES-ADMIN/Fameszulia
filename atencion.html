<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameszulia - Atención al Usuario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; }
        
        header {
            background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px;
        }
        .logo-text { font-weight: bold; font-size: 1.2rem; color: #1b365d; }
        
        nav { display: flex; gap: 15px; align-items: center; }
        nav a {
            background: none; border: none; font-size: 0.9rem; font-weight: bold;
            color: #555; cursor: pointer; padding: 5px 10px; text-decoration: none;
            transition: color 0.3s; white-space: nowrap;
        }
        nav a:hover, nav a.active { color: #1b365d; border-bottom: 2px solid #1b365d; }
        .portal-link {
            background-color: #1b365d !important; color: white !important;
            padding: 8px 15px !important; border-radius: 6px;
        }
        .portal-link:hover { background-color: #2c4d7e !important; }

        .menu-toggle {
            display: none; background: none; border: none; font-size: 1.8rem;
            color: #1b365d; cursor: pointer;
        }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .card h1 { color: #1b365d; font-size: 2rem; margin-bottom: 15px; }
        .card p { color: #555; line-height: 1.6; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; color: #334155; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
        textarea.form-control { resize: vertical; height: 120px; }
        .btn-primary { background-color: #1b365d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary:hover { background-color: #2c4d7e; }

        @media(max-width: 900px) {
            .menu-toggle { display: block; }
            nav {
                display: none; position: absolute; top: 70px; left: 0; width: 100%;
                background-color: white; flex-direction: column; align-items: flex-start;
                padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); gap: 15px;
            }
            nav.open { display: flex; }
            nav a { width: 100%; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
            nav a.portal-link { text-align: center; border-bottom: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">FAMESZULIA</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="nav-menu">
            <a href="index.html">INICIO</a>
            <a href="quienes.html">QUIÉNES SOMOS</a>
            <a href="noticias.html">NOTICIAS</a>
            <a href="multimedia.html">MULTIMEDIA</a>
            <a href="entes.html">ENTES</a>
            <a href="atencion.html" class="active">ATENCIÓN AL USUARIO</a>
            <a href="gestion.html" class="portal-link">PORTAL DE GESTIÓN</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>Atención al Usuario</h1>
            <p>¿Tienes alguna consulta o requieres asistencia? Completa el siguiente formulario y nuestro equipo se pondrá en contacto.</p>
            
            <form onsubmit="alert('¡Solicitud enviada con éxito!'); return false;">
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" class="form-control" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email5" class="form-control" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Motivo o Solicitud</label>
                    <textarea class="form-control" placeholder="Describa su caso..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Mensaje</button>
            </form>
        </div>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById('nav-menu').classList.toggle('open');
        }
    </script>
</body>
</html>
