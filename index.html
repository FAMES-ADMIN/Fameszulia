<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameszulia - Portal Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #666; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Bienvenidos a Fameszulia!</h1>
        <p>Este es nuestro portal web oficial. Diseñado para verse perfecto y cargar ultrarrápido en teléfonos móviles, tablets y computadoras.</p>
        <a href="#" class="btn">Contáctanos</a>
    </div>

</body>
</html>
