<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameszulia - Portal Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #2c3e50; font-size: 1.6rem; margin-bottom: 10px; }
        p { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3498db;
        }
        .btn {
            width: 100%;
            background-color: #3498db;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover { background-color: #2980b9; }
        
        #dashboard {
            display: none;
        }
        .welcome-msg {
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .logout-btn {
            background-color: #e74c3c;
            margin-top: 15px;
        }
        .logout-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="card">
        <div id="login-section">
            <h1>Fameszulia</h1>
            <p>Ingresa tus datos para acceder al portal</p>
            
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ej. admin">
            </div>
            
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="********">
            </div>
            
            <button class="btn" onclick="iniciarSesion()">Entrar</button>
            <p id="error-msg" style="color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none;">Usuario o contraseña incorrectos</p>
        </div>

        <div id="dashboard">
            <h1>¡Bienvenido al Sistema!</h1>
            <p class="welcome-msg">Has iniciado sesión correctamente en Fameszulia.</p>
            <p>Aquí puedes mostrar contenido exclusivo, herramientas o reportes para tu equipo y usuarios autorizados.</p>
            <button class="btn logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        function iniciarSesion() {
            var user = document.getElementById('username').value;
            var pass = document.getElementById('password').value;
            
            // Puedes cambiar aquí el usuario y la contraseña que prefieras
            if (user === "admin" && pass === "1234") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function cerrarSesion() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }
    </script>

</body>
</html>
