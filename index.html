<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameszulia - Inicio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; }
        header {
            background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px;
        }
        .logo-text { font-weight: bold; font-size: 1.2rem; color: #1b365d; }
        nav { display: flex; gap: 15px; overflow-x: auto; align-items: center; }
        nav a {
            background: none; border: none; font-size: 0.9rem; font-weight: bold;
            color: #555; cursor: pointer; padding: 5px 10px; text-decoration: none;
            transition: color 0.3s; white-space: nowrap;
        }
        nav a:hover, nav a.active { color: #1b365d; border-bottom: 2px solid #1b365d; }
        .portal-link {
            background-color: #1b365d !important; color: white !important;
            padding: 8px 15px !important; border-radius: 6px;
        }
        .portal-link:hover { background-color: #2c4d7e !important; border: none !important; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: white; text-align: center; padding: 100px 20px; border-radius: 12px;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 15px; text-transform: uppercase; }
        .hero p { font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

        @media(max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; padding: 15px; }
            nav { margin-top: 15px; width: 100%; justify-content: flex-start; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">FAMESZULIA</div>
        <nav>
            <a href="index.html" class="active">INICIO</a>
            <a href="quienes.html">QUIÉNES SOMOS</a>
            <a href="noticias.html">NOTICIAS</a>
            <a href="multimedia.html">MULTIMEDIA</a>
            <a href="entes.html">ENTES</a>
            <a href="atencion.html">ATENCIÓN AL USUARIO</a>
            <a href="gestion.html" class="portal-link">PORTAL DE GESTIÓN</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Impulsa tu futuro hoy</h1>
            <p>Portal oficial de atención, bienestar y desarrollo social para nuestra comunidad en el estado Zulia.</p>
        </div>
    </div>

</body>
</html>
