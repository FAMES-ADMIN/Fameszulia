<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameszulia - Hemeroteca / Noticias</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; }
        
        /* HEADER Y MENÚ */
        header {
            background-color: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px;
        }
        .logo-text { font-weight: bold; font-size: 1.2rem; color: #1b365d; }
        
        nav { display: flex; gap: 15px; align-items: center; }
        nav a {
            background: none; border: none; font-size: 0.9rem; font-weight: bold;
            color: #555; cursor: pointer; padding: 5px 10px; text-decoration: none;
            transition: color 0.3s; white-space: nowrap;
        }
        nav a:hover, nav a.active { color: #1b365d; border-bottom: 2px solid #1b365d; }
        .portal-link {
            background-color: #1b365d !important; color: white !important;
            padding: 8px 15px !important; border-radius: 6px;
        }
        .portal-link:hover { background-color: #2c4d7e !important; }

        /* BOTÓN HAMBURGUESA (OCULTO EN PC) */
        .menu-toggle {
            display: none; background: none; border: none; font-size: 1.8rem;
            color: #1b365d; cursor: pointer;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .hem-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 30px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px;
        }
        .hem-header h1 { color: #1b365d; font-size: 2.2rem; text-transform: uppercase; margin-bottom: 5px; }
        .hem-header p { color: #666; font-size: 0.95rem; }

        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .news-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px;
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        .news-card:hover { transform: translateY(-4px); }
        .news-img { width: 100%; height: 220px; object-fit: cover; background-color: #cbd5e1; }
        .news-body { padding: 20px; }
        .badge {
            display: inline-block; background-color: #e0f2fe; color: #0369a1;
            font-size: 0.75rem; font-weight: bold; padding: 4px 10px;
            border-radius: 4px; text-transform: uppercase; margin-bottom: 10px;
        }
        .news-title {
            color: #1b365d; font-size: 1.3rem; margin-bottom: 10px; line-height: 1.4;
            cursor: pointer; text-decoration: none; display: block;
        }
        .news-title:hover { color: #2c4d7e; text-decoration: underline; }
        .news-date { font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; }
        .news-snippet { font-size: 0.95rem; color: #555; line-height: 1.6; }

        .sidebar-box {
            background: white; border-radius: 12px; padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px;
        }
        .sidebar-title {
            color: #1b365d; font-size: 1.1rem; font-weight: bold;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;
        }
        
        .recent-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; }
        .recent-item:last-child { margin-bottom: 0; padding-bottom: 0; border: none; }
        .recent-item a {
            font-size: 0.9rem; color: #1b365d; text-decoration: none; font-weight: bold;
            display: block; margin-bottom: 4px; line-height: 1.3; cursor: pointer;
        }
        .recent-item a:hover { text-decoration: underline; }
        .recent-date { font-size: 0.75rem; color: #94a3b8; }

        #detalle-noticia { display: none; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-volver {
            background: none; border: none; color: #1b365d; font-weight: bold;
            cursor: pointer; font-size: 0.9rem; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn-volver:hover { text-decoration: underline; }
        .detail-title { color: #1b365d; font-size: 1.8rem; margin-bottom: 10px; line-height: 1.3; }
        .detail-meta { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .detail-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; }
        .detail-content p { font-size: 1rem; color: #475569; line-height: 1.8; margin-bottom: 15px; }

        /* DISEÑO RESPONSIVO (MÓVIL) */
        @media(max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; }
            .hem-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            
            .menu-toggle { display: block; }
            nav {
                display: none; position: absolute; top: 70px; left: 0; width: 100%;
                background-color: white; flex-direction: column; align-items: flex-start;
                padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); gap: 15px;
            }
            nav.open { display: flex; }
            nav a { width: 100%; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
            nav a.portal-link { text-align: center; border-bottom: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">FAMESZULIA</div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="nav-menu">
            <a href="index.html">INICIO</a>
            <a href="quienes.html">QUIÉNES SOMOS</a>
            <a href="noticias.html" class="active">NOTICIAS</a>
            <a href="multimedia.html">MULTIMEDIA</a>
            <a href="entes.html">ENTES</a>
            <a href="atencion.html">ATENCIÓN AL USUARIO</a>
            <a href="gestion.html" class="portal-link">PORTAL DE GESTIÓN</a>
        </nav>
    </header>

    <div class="container">
        
        <div id="vista-listado">
            <div class="hem-header">
                <div>
                    <h1>Hemeroteca</h1>
                    <p>Mantente informado sobre los proyectos, jornadas y avances de Fames Zulia.</p>
                </div>
            </div>

            <div class="layout-grid">
                <div class="news-list" id="contenedor-noticias-publicas"></div>
                <aside class="sidebar">
                    <div class="sidebar-box">
                        <div class="sidebar-title">⏱️ Recientes</div>
                        <div id="contenedor-recientes-sidebar"></div>
                    </div>
                </aside>
            </div>
        </div>

        <div id="detalle-noticia">
            <button class="btn-volver" onclick="volverListado()">← Volver a Noticias</button>
            <h1 class="detail-title" id="det-titulo">Título</h1>
            <div class="detail-meta" id="det-meta">Fecha</div>
            <span class="badge" id="det-badge">Categoría</span>
            <img src="" alt="Imagen detalle" class="detail-img" id="det-img">
            <div class="detail-content" id="det-texto"></div>
        </div>

    </div>

    <script>
        function toggleMenu() {
            document.getElementById('nav-menu').classList.toggle('open');
        }

        function obtenerNoticiasPublicas() {
            let guardadas = localStorage.getItem('fames_noticias');
            if (guardadas) return JSON.parse(guardadas);
            return [];
        }

        function renderHemeroteca() {
            let noticias = obtenerNoticiasPublicas();
            let contenedorPrincipal = document.getElementById('contenedor-noticias-publicas');
            let contenedorRecientes = document.getElementById('contenedor-recientes-sidebar');
            
            contenedorPrincipal.innerHTML = '';
            contenedorRecientes.innerHTML = '';

            if (noticias.length === 0) {
                contenedorPrincipal.innerHTML = '<p style="padding: 20px; color: #666;">No hay noticias publicadas actualmente.</p>';
                return;
            }

            noticias.forEach(n => {
                let snippet = n.parrafos && n.parrafos.length > 0 ? n.parrafos[0] : '';
                let card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <img src="${n.imagen}" alt="Imagen noticia" class="news-img">
                    <div class="news-body">
                        <span class="badge">${n.categoria}</span>
                        <a class="news-title" onclick="verDetalle('${n.id}')">${n.titulo}</a>
                        <div class="news-date">${n.fecha}</div>
                        <p class="news-snippet">${snippet}</p>
                    </div>
                `;
                contenedorPrincipal.appendChild(card);

                let recentItem = document.createElement('div');
                recentItem.className = 'recent-item';
                recentItem.innerHTML = `
                    <a onclick="verDetalle('${n.id}')">${n.titulo}</a>
                    <div class="recent-date">${n.fecha}</div>
                `;
                contenedorRecientes.appendChild(recentItem);
            });
        }

        function verDetalle(id) {
            let noticias = obtenerNoticiasPublicas();
            let noticia = noticias.find(n => n.id === id);
            if (!noticia) return;

            document.getElementById('det-titulo').innerText = noticia.titulo;
            document.getElementById('det-meta').innerText = `Publicado el ${noticia.fecha} - Por Coord. Fames`;
            document.getElementById('det-badge').innerText = noticia.categoria;
            document.getElementById('det-img').src = noticia.imagen;
            
            let contenedorTexto = document.getElementById('det-texto');
            contenedorTexto.innerHTML = '';
            noticia.parrafos.forEach(p => {
                let parrafoElem = document.createElement('p');
                parrafoElem.innerText = p;
                contenedorTexto.appendChild(parrafoElem);
            });

            document.getElementById('vista-listado').style.display = 'none';
            document.getElementById('detalle-noticia').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function volverListado() {
            document.getElementById('detalle-noticia').style.display = 'none';
            document.getElementById('vista-listado').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderHemeroteca();
    </script>
</body>
</html>
